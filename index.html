<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sequential YouTube Course App</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #121212; color: #f5f5f5; padding: 20px; }
    .container { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
    .card { background: #1e1e1e; padding: 16px; border-radius: 10px; }
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background: #000; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .status-bar { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #bbb; flex-wrap: wrap; gap: 8px; }
    .wake-pill { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: #263238; color: #80cbc4; }
    .cat-pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #2b3a4a; color: #90caf9; font-weight: bold; }
    .warning-msg { color: #ff8a80; font-size: 13px; min-height: 18px; margin-top: 6px; }
    .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 10px; border-radius: 6px; border: 1px solid #3a3a3a;
      background: #282828; color: #ddd; cursor: pointer; font-size: 12px;
    }
    .filter-btn.active { background: #1565c0; border-color: #3ea6ff; color: #fff; font-weight: bold; }
    .lesson-item { display: flex; gap: 6px; margin-bottom: 10px; }
    .lesson-btn {
      flex: 1; text-align: left; padding: 12px; border: 1px solid #333; border-radius: 8px;
      background: #282828; color: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .lesson-btn.active { border-color: #3ea6ff; background: #1f3347; }
    .lesson-btn.completed { border-color: #2e7d32; }
    .lesson-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .lesson-meta { display: flex; flex-direction: column; gap: 4px; }
    .lesson-cat { font-size: 11px; color: #90caf9; }
    .del-btn {
      background: #3a2020; border: 1px solid #5c2b2b; color: #ff8a80; border-radius: 8px;
      padding: 0 10px; cursor: pointer; font-weight: bold;
    }
    .del-btn:hover { background: #b71c1c; color: #fff; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #3a3a3a; white-space: nowrap; }
    .badge.done { background: #2e7d32; }
    .badge.open { background: #1565c0; }
    .add-box { margin-top: 20px; padding-top: 15px; border-top: 1px solid #333; }
    .add-box h4 { margin: 0 0 10px 0; font-size: 15px; }
    .add-box input, .add-box select {
      width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px;
      border: 1px solid #444; background: #121212; color: #fff; font-size: 13px;
    }
    .add-btn {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      background: #2e7d32; color: #fff; font-weight: bold; cursor: pointer;
    }
    .add-btn:hover { background: #388e3c; }
    .reset-btn {
      margin-top: 10px; width: 100%; padding: 8px; border: 1px solid #444; border-radius: 6px;
      background: transparent; color: #aaa; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
      <h2 id="currentTitle" style="margin:0;">Loading...</h2>
      <span id="currentCategoryBadge" class="cat-pill">Category</span>
    </div>
    <div class="video-wrapper">
      <div id="player"></div>
    </div>
    <div class="status-bar">
      <span id="progressText">Watched: 0%</span>
      <span id="resumeNote"></span>
      <span id="wakeStatus" class="wake-pill">Screen Lock: Idle</span>
    </div>
    <div id="warningMsg" class="warning-msg"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Lessons</h3>

    <div class="filter-bar">
      <button class="filter-btn active" data-cat="All" onclick="setCategoryFilter('All')">All</button>
      <button class="filter-btn" data-cat="Career Growth" onclick="setCategoryFilter('Career Growth')">Career Growth</button>
      <button class="filter-btn" data-cat="Relationship" onclick="setCategoryFilter('Relationship')">Relationship</button>
    </div>

    <div id="lessonList"></div>

    <div class="add-box">
      <h4>+ Add YouTube Video</h4>
      <select id="videoCategoryInput">
        <option value="Career Growth">Career Growth</option>
        <option value="Relationship">Relationship</option>
      </select>
      <input type="text" id="videoTitleInput" placeholder="Lesson Title (e.g. Deep Work Summary)" />
      <input type="text" id="videoUrlInput" placeholder="Paste YouTube Link or Video ID" />
      <button class="add-btn" onclick="addNewVideo()">Add Video</button>
      <button class="reset-btn" onclick="resetProgress()">Reset Watch Progress</button>
    </div>
  </div>
</div>

<script>
  const CATEGORIES = ["Career Growth", "Relationship"];

  const DEFAULT_VIDEOS = [
    { id: "jNQXAC9IVRw", title: "Lesson 1: Career Roadmap & Focus", category: "Career Growth" },
    { id: "aqz-KE-bpKQ", title: "Lesson 2: Communication & Boundaries", category: "Relationship" }
  ];

  const STORAGE_KEY = "yt_sequential_app_v5";

  function loadState() {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (saved && Array.isArray(saved.videos) && saved.videos.length > 0) {
      saved.videos.forEach((v, i) => {
        if (!CATEGORIES.includes(v.category)) {
          v.category = i % 2 === 0 ? "Career Growth" : "Relationship";
        }
      });
      return saved;
    }
    return {
      currentIndex: 0,
      unlockedIndex: 0,
      videos: DEFAULT_VIDEOS.map(v => ({ ...v, position: 0, maxWatched: 0, completed: false }))
    };
  }

  let state = loadState();
  let activeFilter = "All";
  let player = null;
  let trackerInterval = null;
  let lastTickTime = 0;
  let pendingSeekSec = null;
  let wakeLockSentinel = null;

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function setCategoryFilter(cat) {
    activeFilter = cat;
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.cat === cat);
    });
    renderPlaylist();
  }

  function updateWakeBadge(text, active = false) {
    const el = document.getElementById("wakeStatus");
    el.textContent = text;
    el.style.color = active ? "#a5d6a7" : "#80cbc4";
    el.style.background = active ? "#1b5e20" : "#263238";
  }

  async function requestScreenWakeLock() {
    if (!("wakeLock" in navigator)) {
      updateWakeBadge("Wake Lock: Unsupported");
      return;
    }
    try {
      if (wakeLockSentinel) return;
      wakeLockSentinel = await navigator.wakeLock.request("screen");
      updateWakeBadge("Screen Awake: ON", true);
      wakeLockSentinel.addEventListener("release", () => {
        wakeLockSentinel = null;
        if (!document.hidden) {
          updateWakeBadge("Screen Awake: OFF");
        }
      });
    } catch (err) {
      updateWakeBadge("Screen Awake: Blocked");
    }
  }

  async function releaseScreenWakeLock() {
    try {
      if (wakeLockSentinel) {
        await wakeLockSentinel.release();
        wakeLockSentinel = null;
      }
    } catch (_) {}
  }

  function showWarning(msg) {
    const el = document.getElementById("warningMsg");
    el.textContent = msg;
    clearTimeout(showWarning._timer);
    showWarning._timer = setTimeout(() => { el.textContent = ""; }, 3000);
  }

  function extractVideoId(input) {
    const str = input.trim();
    const regExp = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = str.match(regExp);
    if (match) return match[1];
    if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
    return null;
  }

  function addNewVideo() {
    const catInput = document.getElementById("videoCategoryInput");
    const titleInput = document.getElementById("videoTitleInput");
    const urlInput = document.getElementById("videoUrlInput");
    const videoId = extractVideoId(urlInput.value);

    if (!videoId) {
      alert("সঠিক YouTube লিংক অথবা ১১ অক্ষরের Video ID দিন!");
      return;
    }

    const category = CATEGORIES.includes(catInput.value) ? catInput.value : "Career Growth";
    const title = titleInput.value.trim() || `${category} Lesson ${state.videos.length + 1}`;

    state.videos.push({
      id: videoId,
      title: title,
      category: category,
      position: 0,
      maxWatched: 0,
      completed: false
    });

    const prevIdx = state.videos.length - 2;
    if (prevIdx >= 0 && state.videos[prevIdx].completed) {
      state.unlockedIndex = Math.max(state.unlockedIndex, state.videos.length - 1);
    }

    titleInput.value = "";
    urlInput.value = "";
    saveState();
    renderPlaylist();
  }

  function deleteVideo(idx) {
    if (state.videos.length <= 1) {
      alert("কমপক্ষে ১টি ভিডিও থাকতে হবে!");
      return;
    }
    state.videos.splice(idx, 1);
    if (state.currentIndex >= state.videos.length) state.currentIndex = state.videos.length - 1;
    if (state.unlockedIndex >= state.videos.length) state.unlockedIndex = state.videos.length - 1;
    saveState();
    loadPlayer(state.currentIndex);
  }

  function resetProgress() {
    if (!confirm("সব ভিডিওর প্রোগ্রেস রিসেট করে প্রথম থেকে শুরু করবেন?")) return;
    state.currentIndex = 0;
    state.unlockedIndex = 0;
    state.videos.forEach(v => {
      v.position = 0;
      v.maxWatched = 0;
      v.completed = false;
    });
    saveState();
    loadPlayer(0);
  }

  function renderPlaylist() {
    const listEl = document.getElementById("lessonList");
    listEl.innerHTML = "";

    const visibleItems = state.videos
      .map((vid, idx) => ({ vid, idx }))
      .filter(({ vid }) => activeFilter === "All" || vid.category === activeFilter);

    if (visibleItems.length === 0) {
      listEl.innerHTML = `<p style="color:#999; font-size:13px;">এই ক্যাটাগরিতে কোনো ভিডিও নেই।</p>`;
      return;
    }

    visibleItems.forEach(({ vid, idx }) => {
      const isUnlocked = idx <= state.unlockedIndex;
      const row = document.createElement("div");
      row.className = "lesson-item";

      const btn = document.createElement("button");
      btn.className = "lesson-btn" +
        (idx === state.currentIndex ? " active" : "") +
        (vid.completed ? " completed" : "");
      btn.disabled = !isUnlocked;

      let badgeText = "Locked";
      let badgeClass = "badge";
      if (vid.completed) {
        badgeText = "Completed";
        badgeClass += " done";
      } else if (isUnlocked) {
        badgeText = "Unlocked";
        badgeClass += " open";
      }

      btn.innerHTML = `
        <div class="lesson-meta">
          <span>${idx + 1}. ${vid.title}</span>
          <span class="lesson-cat">${vid.category}</span>
        </div>
        <span class="${badgeClass}">${badgeText}</span>
      `;
      btn.onclick = () => selectVideo(idx);

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.title = "Remove video";
      delBtn.textContent = "×";
      delBtn.onclick = () => deleteVideo(idx);

      row.appendChild(btn);
      row.appendChild(delBtn);
      listEl.appendChild(row);
    });
  }

  function updateUI(duration = 0) {
    const idx = state.currentIndex;
    const vid = state.videos[idx];
    document.getElementById("currentTitle").textContent = vid.title;
    document.getElementById("currentCategoryBadge").textContent = vid.category;

    const pct = duration > 0 ? Math.min(100, Math.round((vid.maxWatched / duration) * 100)) : (vid.completed ? 100 : 0);
    document.getElementById("progressText").textContent = `Watched: ${pct}%`;
    document.getElementById("resumeNote").textContent =
      vid.position > 1 && !vid.completed ? `Saved at ${Math.floor(vid.position)}s` : "";
  }

  function unlockNext(idx) {
    const vid = state.videos[idx];
    const duration = (player && typeof player.getDuration === "function") ? player.getDuration() : 0;

    if (duration > 0 && vid.maxWatched < duration * 0.90) {
      return false;
    }

    vid.completed = true;
    vid.position = 0;
    if (idx + 1 < state.videos.length && state.unlockedIndex < idx + 1) {
      state.unlockedIndex = idx + 1;
    }
    saveState();
    renderPlaylist();
    return true;
  }

  function syncCurrentPosition() {
    if (!player || typeof player.getCurrentTime !== "function") return;
    const t = player.getCurrentTime();
    const d = player.getDuration();
    const vid = state.videos[state.currentIndex];
    if (!vid || typeof t !== "number" || isNaN(t)) return;

    if (!vid.completed) {
      const allowedMax = Math.max(vid.maxWatched, lastTickTime) + 2.5;
      if (t > allowedMax) {
        const safePos = Math.max(0, vid.maxWatched);
        player.seekTo(safePos, true);
        vid.position = safePos;
        lastTickTime = safePos;
        saveState();
        showWarning("ভিডিও না দেখে সামনে স্কিপ করা যাবে না! যেখান থেকে দেখেছেন সেখান থেকে দেখুন।");
        return;
      }
      if (t > vid.maxWatched) {
        vid.maxWatched = t;
      }
      vid.position = (d && t >= d - 2) ? 0 : t;
    } else {
      vid.position = (d && t >= d - 2) ? 0 : t;
    }

    lastTickTime = t;
    saveState();
    updateUI(d || 0);
  }

  function startTracking() {
    clearInterval(trackerInterval);
    trackerInterval = setInterval(() => {
      if (!player || typeof player.getPlayerState !== "function") return;
      const stateCode = player.getPlayerState();
      if (stateCode === YT.PlayerState.PLAYING) {
        syncCurrentPosition();
        const d = player.getDuration();
        const vid = state.videos[state.currentIndex];
        if (d > 0 && vid.maxWatched >= d * 0.96) {
          unlockNext(state.currentIndex);
        }
      }
    }, 1000);
  }

  function loadPlayer(idx) {
    const vid = state.videos[idx];
    const startSec = vid.completed ? 0 : Math.max(0, Math.floor(vid.position || 0));
    lastTickTime = startSec;
    pendingSeekSec = startSec > 0 ? startSec : null;

    updateUI(0);
    renderPlaylist();

    if (player && typeof player.loadVideoById === "function") {
      player.loadVideoById({ videoId: vid.id, startSeconds: startSec });
      return;
    }

    player = new YT.Player("player", {
      videoId: vid.id,
      playerVars: {
        start: startSec,
        rel: 0,
        modestbranding: 1,
        playsinline: 1,
        origin: window.location.origin
      },
      events: {
        onReady: () => {
          const d = player.getDuration();
          updateUI(d);
          if (pendingSeekSec && pendingSeekSec > 0) {
            player.seekTo(pendingSeekSec, true);
          }
          startTracking();
        },
        onStateChange: (event) => {
          if (event.data === YT.PlayerState.PLAYING) {
            requestScreenWakeLock();
            if (pendingSeekSec && pendingSeekSec > 0) {
              const nowT = player.getCurrentTime();
              if (Math.abs(nowT - pendingSeekSec) > 3) {
                player.seekTo(pendingSeekSec, true);
              }
              pendingSeekSec = null;
            }
            lastTickTime = player.getCurrentTime();
            startTracking();
          } else if (event.data === YT.PlayerState.PAUSED) {
            syncCurrentPosition();
            releaseScreenWakeLock();
          } else if (event.data === YT.PlayerState.ENDED) {
            releaseScreenWakeLock();
            const currentVid = state.videos[state.currentIndex];
            const d = player.getDuration();
            if (!currentVid.completed && d > 0 && currentVid.maxWatched < d * 0.90) {
              const safePos = Math.max(0, currentVid.maxWatched);
              currentVid.position = safePos;
              lastTickTime = safePos;
              saveState();
              showWarning("ভিডিও শেষ না করে টেনে দিলে পরের লেসন আনলক হবে না!");
              player.seekTo(safePos, true);
              player.playVideo();
              return;
            }
            currentVid.maxWatched = Math.max(currentVid.maxWatched, d || 0);
            unlockNext(state.currentIndex);
            updateUI(d || 0);
          }
        }
      }
    });
  }

  function selectVideo(idx) {
    if (idx > state.unlockedIndex) return;
    syncCurrentPosition();
    state.currentIndex = idx;
    saveState();
    loadPlayer(idx);
  }

  document.addEventListener("visibilitychange", async () => {
    if (document.hidden) {
      syncCurrentPosition();
      await releaseScreenWakeLock();
    } else {
      updateUI((player && typeof player.getDuration === "function") ? player.getDuration() : 0);
      if (player && typeof player.getPlayerState === "function" && player.getPlayerState() === YT.PlayerState.PLAYING) {
        await requestScreenWakeLock();
      }
    }
  });

  window.addEventListener("beforeunload", () => {
    syncCurrentPosition();
    releaseScreenWakeLock();
  });

  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = () => {
    loadPlayer(state.currentIndex);
  };
</script>

</body>
</html>
